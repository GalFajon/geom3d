        <style>
            .modal {
                display: block;
                position: fixed;
                z-index: 1;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: none;
                background-color: rgb(0,0,0);
                background-color: rgba(0,0,0,0.4);
            }

            .modal-content {
                background-color: #fefefe;
                margin: auto;
                padding: 20px;
                border: 1px solid #888;
                width: 80%;
            }

            .timer {
                display: block;
                position: fixed;
                z-index: 1;
                left: 0;
                top: 0;
                width: 100px;
                height: 50px;
                overflow: auto;
                background-color: #fefefe;
                padding: 10px;
            }
        </style>
    </head>

    <body>
        <span id="label" style="color: white;">Test.</span>

        <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
            <div id="potree_render_area"></div>
            <div id="potree_sidebar_container"> </div>
        </div>

        <div class="timer" id="timer">
            <span id="timerInfo" style="margin-bottom: 10px;">Cas: 0</span>
        </div>

        <script type="module">
            import { initialize, setView, PointcloudLayer, GeometryLayer, OverlayLayer, Line, Polygon, Point, View, Draw, Snap, Select, Modify, IFCLayer, GeoJSON, Overlay } from './geom3d.js';
            import ChallengeModal from './ChallengeModal.js';
            import o from './izziv3.js';

            async function main() {
                await initialize({
                    viewer: {
                        background: 'skybox'
                    }
                })
                
                let geomLayer = new GeometryLayer({
                    geometries: GeoJSON.import(o)
                });

                let geomLayer2 = new GeometryLayer({
                    geometries: []
                })

                let ptcldLayer = new PointcloudLayer({ urls: ['https://projekti.lgb.si/WebPointCloud/RawData/DataConverted/20221107_most Sava_Sentjakob/metadata.json'] });

                let draw = new Draw({ layer: geomLayer2, type: "Line" });

                let view = new View({
                    layers: [ 
                        ptcldLayer,
                        geomLayer,
                        geomLayer2 
                    ],
                    interactions: [ 
                        new Snap({ layers: [ ptcldLayer ]}),
                        draw
                    ]
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key == 'Escape') {
                        draw.setActive(false);
                        draw.setActive(true);
                    }
                    else if (e.key == 'z') {
                        draw.undo();
                    }
                })
                
                draw.addEventListener('drawend', (e) => {
                    geomLayer.add(e.detail);
                })

                geomLayer.disableDepthTesting();

                await setView(view);
                view.center();
                
                let cm = new ChallengeModal(`
                    <h2>Izziv 3</h2>
                    <p>Ustvarite tri linije, ki povezujejo točke na mostu (dve vzporedni in horizontalni in eno vertikalno).</p>
                    <img src="izziv3.png">
                `);

                cm.modal.addEventListener('end', (e) => {
                    let res = GeoJSON.export(geomLayer2);
                    res.properties = {
                        time: e.detail
                    }

                    let a = document.createElement("a");
                    let file = new Blob([JSON.stringify(res)], {type: 'application/json'});
                    a.href = URL.createObjectURL(file);
                    a.download = "izziv2.geojson";
                    a.click();
                })

                let i = 0;

                draw.addEventListener('drawend', (e) => {
                    geomLayer2.add(e.detail);
                    i++;

                    if (i == 3) cm.end();
                })

                /*draw.addEventListener('vertexadded', (e) => {
                    let found = false;

                    for (let geom of geomLayer.geometries) {
                        if (geom.type == 'Point' && 
                            geom.vectors[0] == e.detail.vertex[0] &&
                            geom.vectors[1] == e.detail.vertex[1] && 
                            geom.vectors[2] == e.detail.vertex[2]
                        ) {
                            found = true;
                            break;
                        }
                    }

                    if (!found) draw.undo();
                });*/
            }

            main();
        </script>
    </body>
</html>
